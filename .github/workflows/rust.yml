name: Coq Proof Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-coq:
    runs-on: ubuntu-latest

    steps:
    - name: Repository Checkout
      uses: actions/checkout@v4

    - name: Install Coq Prover Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y opam make
        opam init -y --disable-sandboxing
        opam repo add coq-released https://coq.inria.fr/opam/released
        opam update
        opam install -y coq

    - name: Run Coq Verification
      run: |
        eval $(opam env)
        coq_makefile -f _CoqProject -o Makefile.coq
        make -f Makefile.coq
