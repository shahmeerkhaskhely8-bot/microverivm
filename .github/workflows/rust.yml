name: CI Build and Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Repository Checkout
      uses: actions/checkout@v4

    - name: Setup Rust Environment
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Run Cargo Tests
      run: |
        cargo check --verbose
        cargo test --verbose

    - name: Install Coq Prover Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y opam make
        opam init -y --disable-sandboxing
        opam repo add coq-released https://coq.inria.fr/opam/released
        opam update
        opam install -y coq

    - name: Verify Coq Proofs and Models
      run: |
        eval $(opam env)
        if [ -f "Makefile" ]; then
          make
        else
          coqc -R coq/src MicroVeriVM coq/src/*.v
        fi
